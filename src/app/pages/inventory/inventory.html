<div class="page-container">

  <div class="page-header">
    <h2>Inventory Management</h2>
  </div>

  <div class="search-box">
    <input
      type="text"
      placeholder="Search product..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearch()" />
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Sl.No</th>
          <th>Product Name</th>
          <th>Total Stock</th>
          <th>Available Stock</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of pagedItems; let i = index"
            [ngClass]="{
              'out-stock-row': item.total_stock === 0,
              'low-stock-row': item.total_stock > 0 && item.total_stock <= 5,
            }">

          <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>

          <td>{{ item.product_name }}</td>

          <!-- Stock Column -->
          <td>
              {{ item.total_stock }}
          </td>

          <!-- Price -->
          <td>{{ item.available_stock}}</td>
          <!-- Status -->
          <td>
            <span *ngIf="item.total_stock > 5" class="in-stock">
              In Stock
            </span>

            <span *ngIf="item.total_stock > 0 && item.total_stock <= 5" class="low-stock">
              Low Stock
            </span>

            <span *ngIf="item.total_stock === 0" class="out-stock">
              Out of Stock
            </span>
          </td>

        </tr>
        <tr *ngIf="pagedItems.length === 0">
          <td colspan="5" style="text-align:center; padding: 20px;">No inventory items found</td>
        </tr>
      </tbody>

    </table>

    <!-- Pagination -->
    <div class="pagination" *ngIf="totalPages > 1">
      <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">Prev</button>

      <button
        *ngFor="let p of pages"
        (click)="goToPage(p)"
        [class.active]="p === currentPage">
        {{ p }}
      </button>

      <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">Next</button>
    </div>
  </div>

</div>
