<div class="page-container">

  <div class="page-header">
    <h2>Inventory Management</h2>
  </div>

  <div class="search-box">
    <input type="text" placeholder="Search product..." />
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Sl.No</th>
          <th>Product Name</th>
          <th>Total Stock</th>
          <th>Available Stock</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of inventoryItems; let i = index"
            [ngClass]="{
              'out-stock-row': item.quantity === 0,
              'low-stock-row': item.quantity > 0 && item.quantity <= 5,
            }">

          <td>{{ i + 1 }}</td>

          <td>{{ item.product_name }}</td>

          <!-- Stock Column -->
          <td>
              {{ item.quantity }}
          </td>

          <!-- Price -->
          <td>{{ item.available_stock}}</td>
          <!-- Status -->
          <td>
            <span *ngIf="item.quantity > 5" class="in-stock">
              In Stock
            </span>

            <span *ngIf="item.quantity > 0 && item.quantity <= 5" class="low-stock">
              Low Stock
            </span>

            <span *ngIf="item.quantity === 0" class="out-stock">
              Out of Stock
            </span>
          </td>

        </tr>
      </tbody>

    </table>
  </div>

</div>
