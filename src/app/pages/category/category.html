<div class="page-container">

  <div class="page-header">
    <h2>Category Management</h2>
    <button class="add-btn" (click)="openAddModal()">+ Add Category</button>
  </div>

  <div class="search-box">
    <input type="text" placeholder="Search cat..." />
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Category Name</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of cats; let i=index">
          <td>{{ cat.id }}</td>
          <td>{{ cat.name }}</td>
          <td>
            <button class="edit" (click)="openEditModal(cat)">Edit</button>
            <button class="delete" (click)="deleteCat(cat.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

 <!-- Modal -->
<div class="modal-overlay" *ngIf="showModal">
  <div class="modal-content">

    <div class="modal-header">
      <h3>{{ modalType === 'add' ? 'Add Category' : 'Edit Category' }}</h3>
      <span class="close-btn" (click)="showModal=false">×</span>
    </div>

    <div class="modal-body">
      <label>Category Name</label>
      <input type="text" [(ngModel)]="catName" placeholder="Enter Category Name" />
    </div>
    <div class="modal-actions">
      <button class="save-btn" (click)="save()">
        {{ modalType === 'add' ? 'Add Category' : 'Update Category' }}
      </button>

      <button class="cancel-btn" (click)="showModal=false">
        Cancel
      </button>
    </div>

  </div>
</div>

</div>
