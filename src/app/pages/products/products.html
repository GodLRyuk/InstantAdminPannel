<div class="page-container">

  <div class="page-header">
    <h2>Product</h2>
    <button class="add-btn" (click)="openAddModal()">+ Add Product</button>
  </div>

  <div class="search-box">
    <input
      type="text"
      placeholder="Search product..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearch()" />
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Product Name</th>
          <th>Price</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let prod of pagedProducts; let i=index">
          <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
          <td>{{ prod.name }}</td>
          <td>{{ prod.price }}</td>
          <td>
            <button class="edit" (click)="openEditModal(prod)">Edit</button>
            <button class="delete" (click)="deleteProduct(prod.id)">Delete</button>
          </td>
        </tr>
        <tr *ngIf="pagedProducts.length === 0">
          <td colspan="4" style="text-align:center; padding: 20px;">No products found</td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination" *ngIf="totalPages > 1">
      <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">Prev</button>

      <button
        *ngFor="let p of pages"
        (click)="goToPage(p)"
        [class.active]="p === currentPage">
        {{ p }}
      </button>

      <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">Next</button>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" *ngIf="showModal">
    <div class="modal-content">

      <div class="modal-header">
        <h3>{{ modalType === 'add' ? 'Add Product' : 'Edit Product' }}</h3>
        <span class="close-btn" (click)="showModal=false">×</span>
      </div>

      <div class="modal-body">

        <!-- Row 1 -->
        <div class="row">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" [(ngModel)]="product.name" />
          </div>

          <div class="form-group">
            <label>Price</label>
            <input type="number" [(ngModel)]="product.price" />
          </div>
        </div>

        <!-- Row 2 -->
        <div class="row">
          <div class="form-group">
            <label>Discount (%)</label>
            <input type="number" [(ngModel)]="product.discount_percent" />
          </div>
          <div class="form-group">
            <label>Brand</label>
            <select [(ngModel)]="product.brand">
              <option *ngFor="let u of brands" [value]="u.id">
                {{ u.name }}
              </option>
            </select>
          </div>
        </div>

        <!-- Row 3 -->
        <div class="row">
          <div class="form-group">
            <label>Category</label>
            <select [(ngModel)]="product.category" (change)="onCategoryChange()">
              <option *ngFor="let cat of categories" [ngValue]="cat.id">
                {{ cat.name }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label>Subcategory</label>
            <select [(ngModel)]="product.subcategory">
              <option *ngFor="let sub of filteredSubcategories" [ngValue]="sub.id">
                {{ sub.name }}
              </option>
            </select>
          </div>
        </div>

        <!-- Row 4 -->
        <div class="row">
          <div class="form-group">
            <label>Unit</label>
            <select [(ngModel)]="product.unit">
              <option *ngFor="let u of units" [value]="u.id">
                {{ u.name }}
              </option>
            </select>
          </div>
          <div class="form-group">
            <label>Unit Size</label>
            <input type="number" [(ngModel)]="product.unit_size" placeholder="e.g. 500" />
          </div>
        </div>
        <div class="row">
          <!-- Image -->
          <div class="form-group">
            <label>Image</label>
            <div class="image-upload-box" (click)="fileInput.click()">
              <input #fileInput type="file" hidden (change)="onFileSelected($event)" />

              <div *ngIf="!imagePreview">📷 Upload</div>
              <img *ngIf="imagePreview" [src]="imagePreview" />
            </div>
          </div>

        </div>

        <!-- Full Width -->
        <div class="form-group full">
          <label>Description</label>
          <textarea [(ngModel)]="product.description"></textarea>
        </div>

        <!-- Toggle -->
        <div class="form-group">
          <label>Active</label>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="product.is_active" />
            <span class="slider"></span>
          </label>
        </div>

      </div>

      <div class="modal-actions">
        <button class="save-btn" (click)="save()">Save</button>
        <button class="cancel-btn" (click)="showModal=false">Cancel</button>
      </div>

    </div>
  </div>
</div>
