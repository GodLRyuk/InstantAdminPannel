<div class="wrap">
  <h1 class="page-title">Orders</h1>

  <div class="tabs">
    <button class="tab" [class.active]="selectedTab === 'all'" (click)="filterOrders('all')">All</button>
    <button class="tab" [class.active]="selectedTab === 'confirmed'" (click)="filterOrders('confirmed')">Confirmed</button>
    <button class="tab" [class.active]="selectedTab === 'pending'" (click)="filterOrders('pending')">Pending</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-id">Order ID</th>
          <th class="col-items">Items & Batch</th>
          <th class="col-status">Status</th>
          <th class="col-amount">Amount</th>
          <th class="col-action">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of paginatedOrders">

          <td>
            <span class="order-id">#{{ order.id }}</span>
          </td>

          <td>
            <div class="item-row" *ngFor="let item of order.items">
              <span class="item-name">{{ item.product_name }}</span>
              <span class="batch-pill" *ngIf="item.batch_no">{{ item.batch_no }}</span>
              <span class="batch-pill no-batch" *ngIf="!item.batch_no">No batch</span>
            </div>
          </td>

          <td>
            <span class="badge" [ngClass]="order.order_status.toLowerCase()">
              {{ order.order_status | titlecase }}
            </span>
          </td>

          <td>
            <span class="amount">₹{{ order.total_amount }}</span>
          </td>

          <td>
            <button class="btn btn-confirm"
              *ngIf="order.order_status === 'PENDING'"
              (click)="updateStatus(order, 'CONFIRMED')">
              Confirm
            </button>

            <button class="btn btn-ship"
              *ngIf="order.order_status === 'CONFIRMED'"
              (click)="updateStatus(order, 'SHIPPED')">
              Ship
            </button>

            <button class="btn" disabled
              *ngIf="order.order_status === 'SHIPPED' || order.order_status === 'DELIVERED'">
              {{ order.order_status | titlecase }}
            </button>
          </td>

        </tr>

        <tr *ngIf="paginatedOrders.length === 0">
          <td colspan="5" class="empty">No orders found</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="loader" *ngIf="loading">Updating status...</div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button class="pg-btn" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">&#8249;</button>
    <button class="pg-btn"
      *ngFor="let page of [].constructor(totalPages); let i = index"
      [class.active]="currentPage === i + 1"
      (click)="goToPage(i + 1)">
      {{ i + 1 }}
    </button>
    <button class="pg-btn" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">&#8250;</button>
  </div>
</div>
