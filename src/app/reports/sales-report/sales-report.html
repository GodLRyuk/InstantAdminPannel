<div class="page-container">
  <h2>Sales Report</h2>

  <div class="filters">
    <label>From: <input type="date" class="form-control" [(ngModel)]="startDate" /></label>
    <label>To:  <input type="date" class="form-control" [(ngModel)]="endDate" /></label>
    &nbsp;
    <button  class="btn btn-confirm"(click)="loadSalesTrend()">Apply</button>
    &nbsp;
  <button  class="btn btn-confirm" (click)="exportToExcel()">Export Excel</button>

  </div>

  <section class="chart-card" aria-labelledby="daily-sales-title">
    <h3 id="daily-sales-title">Daily sales</h3>
    @if (loading()) {
      <p role="status">Loading daily sales…</p>
    }
    @if (errorMessage()) {
      <p role="alert">{{ errorMessage() }}</p>
    }
    <div class="daily-sales-chart">
      <canvas #salesCanvas role="img" aria-label="Bar chart of daily sales in Indian rupees"></canvas>
    </div>
  </section>
</div>
