<div class="admin-container">

  <!-- Sidebar -->
  <div class="sidebar">
  <div class="logo">
  <img src="logo_transperent.png" alt="logo" style="width: 150px; height: 100px;padding-top: 30px;">
  </div>

<ul class="menu">
  <li routerLink="/dashboard">Dashboard</li>
  <li routerLink="/banner">Banner</li>
  <li routerLink="/advbanner">Adv Banner</li>
  <li routerLink="/brand">Brand</li>
  <li routerLink="/unit">Unit</li>
  <li routerLink="/category">Category</li>
  <li routerLink="/subcategory">Sub Category</li>
  <li class="submenu-label" (click)="toggleReports()" [class.open]="reportsOpen">
    <span class="submenu-title">Reports</span>
    <span class="submenu-arrow">{{ reportsOpen ? '▾' : '▸' }}</span>
  </li>
  <ul class="submenu" *ngIf="reportsOpen">
    <li routerLink="/reports/sales">Sales Report</li>
    <li routerLink="/reports/brand-products">Brand Products Report</li>
  </ul>
  <li routerLink="/settlements">Settlements</li>
</ul>

  </div>

  <!-- Main Area -->
  <div class="main">

    <app-header></app-header>

    <div class="admin-notification" *ngIf="notificationVisible">
      {{ notificationMessage }}
    </div>

    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>

    <app-footer></app-footer>

  </div>
