<div class="admin-container">

  <!-- Sidebar -->
  <div class="sidebar">
  <div class="logo">
  <img src="logo_transperent.png" alt="logo" style="width: 150px; height: 100px;padding-top: 30px;">
  </div>

<ul class="menu">
  <li routerLink="/dashboard"><span class="menu-icon">🏠</span>Dashboard</li>
  <li routerLink="/banner"><span class="menu-icon">🖼️</span>Banner</li>
  <li routerLink="/advbanner"><span class="menu-icon">⭐</span>Adv Banner</li>
  <li routerLink="/brand"><span class="menu-icon">🏷️</span>Brand</li>
  <li routerLink="/unit"><span class="menu-icon">📏</span>Unit</li>
  <li routerLink="/category"><span class="menu-icon">📂</span>Category</li>
  <li routerLink="/subcategory"><span class="menu-icon">🗂️</span>Sub Category</li>
  <li class="submenu-label" (click)="toggleReports()" [class.open]="reportsOpen">
    <span class="menu-icon">📊</span>
    <span class="submenu-title">Reports</span>
    <span class="submenu-arrow">{{ reportsOpen ? '▾' : '▸' }}</span>
  </li>
  <ul class="submenu" *ngIf="reportsOpen">
    <li routerLink="/reports/sales"><span class="menu-icon">💹</span>Sales Report</li>
    <li routerLink="/reports/brand-products"><span class="menu-icon">📦</span>Brand Products Report</li>
  </ul>
  <li routerLink="/settlements"><span class="menu-icon">💰</span>Settlements</li>
</ul>

  </div>

  <!-- Main Area -->
  <div class="main">

    <app-header></app-header>

    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>

    <app-footer></app-footer>

  </div>
